name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

# Allow one concurrent deploy per branch; leave in-flight runs alone.
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.165.0'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build docs site
        working-directory: docs
        run: hugo --minify --baseURL 'https://spectralab.cc/'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/public --project-name=spectralab --branch=main --commit-hash=${{ github.sha }}
          quiet: true