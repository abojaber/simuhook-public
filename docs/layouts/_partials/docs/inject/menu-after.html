<div class="book-theme-toggle" role="group" aria-label="Color theme">
  <button type="button" data-theme-value="auto" class="book-theme-btn" title="System (auto)">
    <i class="fa-solid fa-desktop" aria-hidden="true"></i>
  </button>
  <button type="button" data-theme-value="light" class="book-theme-btn" title="Light">
    <i class="fa-solid fa-sun" aria-hidden="true"></i>
  </button>
  <button type="button" data-theme-value="dark" class="book-theme-btn" title="Dark">
    <i class="fa-solid fa-moon" aria-hidden="true"></i>
  </button>
</div>
