baseURL = 'https://spectralab.cc/'
title = 'spectralab'
theme = 'hugo-book'

# Book theme params (https://github.com/alex-shpak/hugo-book)
[params]
  BookTheme = 'auto'      # system color mode: auto = follow OS dark/light; also light | dark
  BookToC = true          # table of contents
  BookSection = 'docs/simuhook'    # main docs section
  BookDateFormat = '2006-01-02'
  BookRepo = 'https://github.com/abojaber/simuhook'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/docs/{{ .Path }}'

[markup]
  [markup.goldmark.renderer]
    # Allow raw HTML (e.g. <i class="fa-solid …"> icons) in content files.
    # Content is first-party; unsafe HTML is not a concern here.
    unsafe = true
  [markup.highlight]
    style = 'github'
    guessSyntax = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3