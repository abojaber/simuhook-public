# User created webhook — request matching demo.
# Demonstrates: header matching, payload matching, custom response headers, delay.
# Only matches POST requests with X-Event: user.created AND body {"event":"user.created"}.
id: user-create
method: POST
path: /webhooks/user
headers:
  X-Event: user.created
payload: '{"event":"user.created"}'
response:
  status_code: 201
  body: '{"received":true,"event":"user.created"}'
  headers:
    X-Mock: "yes"
  delay: 200ms
