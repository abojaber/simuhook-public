# Order placed webhook — header matching demo.
# Demonstrates: header matching, custom status code (202), delay.
# Only matches POST requests with X-Event: order.placed.
id: order-placed
method: POST
path: /webhooks/order
headers:
  X-Event: order.placed
response:
  status_code: 202
  body: '{"acknowledged":true,"event":"order.placed"}'
  delay: 500ms
