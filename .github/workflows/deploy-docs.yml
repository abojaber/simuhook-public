name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/**']
  workflow_dispatch:

# Allow one concurrent deploy per branch; leave in-flight runs alone.
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.165.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build docs site
        working-directory: docs
        run: hugo --minify --baseURL 'https://spectralab.cc/'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create Pages project (if needed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages project create spectralab --production-branch main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy docs/public --project-name=spectralab --branch=main --commit-hash=${{ github.sha }}