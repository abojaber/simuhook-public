# Ping endpoint — query parameter matching demo.
# Demonstrates: query string matching, JSON response with Content-Type header.
# Only matches GET /ping when both ping_id AND ping_child are present with exact values.
id: ping
method: GET
path: /ping
query:
  ping_id: "11022022"
  ping_child: "43443"
response:
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{"message":"pong"}'
