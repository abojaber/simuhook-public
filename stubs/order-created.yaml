# Order created webhook — template mode demo.
# Demonstrates: template: true — dynamic body and headers with Go template variables.
# Each request gets a fresh UUID, timestamp, and dynamic values injected.
# Template variables available: .UUID, .Now, .Timestamp, .RequestID, .Method, .Path, .Body
# Template functions available: Header, Query, RandomInt, RandomHex
id: order-created
method: POST
path: /webhooks/orders
response:
  status_code: 200
  template: true
  headers:
    X-Request-ID: "{{.RequestID}}"
    X-Timestamp: "{{.Now}}"
  body: '{"id":"{{.UUID}}","event":"order.created","timestamp":{{.Timestamp}},"method":"{{.Method}}","body":"{{.Body}}"}'
